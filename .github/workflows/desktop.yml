name: Desktop build, verification and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.packages

jobs:
  windows:
    name: Verify and package Windows
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Check release version
        run: ./Packaging/Get-ReleaseVersion.ps1 -GitHubOutput $env:GITHUB_OUTPUT
      - name: Restore locked dependencies
        run: dotnet restore DialogueMachine.slnx --configfile NuGet.Config --locked-mode
      - name: Run regression checks
        run: |
          dotnet run --project tests/DialogueMachine.Tests.csproj --no-restore -c Release -- artifacts | Tee-Object -FilePath verification.txt
          if ($LASTEXITCODE -ne 0) { throw 'Regression checks failed.' }
      - name: Build the self-contained app
        run: ./build.ps1 -Runtime win-x64
      - name: Validate and replay committed scenario fixtures
        run: |
          dotnet run --project CLI/DialogueMachine.Cli.csproj --no-restore -c Release -- validate tests/Fixtures/repeatable.dialogue.json | Tee-Object -FilePath artifacts/ci-scenario-validation.json
          if ($LASTEXITCODE -ne 0) { throw 'CLI fixture validation failed.' }
          dotnet run --project CLI/DialogueMachine.Cli.csproj --no-build -c Release -- replay tests/Fixtures/repeatable.dialogue.json --all --analyze --trace artifacts/ci-scenario-trace.json
          if ($LASTEXITCODE -ne 0) { throw 'CLI scenario fixtures failed.' }
      - name: Check native Windows startup
        run: ./Packaging/Test-WindowsPackage.ps1
      - name: Create release ZIP and checksum
        run: ./Packaging/New-WindowsRelease.ps1
      # Every run builds the ZIP; only release tags store it, for the release job.
      - name: Upload Windows package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      # Screenshots and logs are only kept to diagnose failed runs.
      - name: Upload verification results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification
          path: |
            verification.txt
            artifacts/**/*.png
            artifacts/native/**/*.json
            artifacts/native/**/*.txt
            artifacts/ci-scenario-*.json
          retention-days: 3
          overwrite: true

  cross-platform:
    name: Verify ${{ matrix.rid }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # An explicit bash shell adds pipefail, so a command piped into tee can fail the step.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore DialogueMachine.slnx --configfile NuGet.Config --locked-mode
      - name: Run headless regression checks
        run: |
          dotnet run --project tests/DialogueMachine.Tests.csproj --no-restore -c Release -- artifacts | tee verification.txt
      - name: Validate and replay committed scenario fixtures
        run: |
          mkdir -p artifacts
          dotnet run --project CLI/DialogueMachine.Cli.csproj --no-restore -c Release -- validate tests/Fixtures/repeatable.dialogue.json | tee artifacts/ci-scenario-validation.json
          dotnet run --project CLI/DialogueMachine.Cli.csproj --no-build -c Release -- replay tests/Fixtures/repeatable.dialogue.json --all --analyze --trace artifacts/ci-scenario-trace.json
      - name: Package target platform binary
        run: bash build.sh ${{ matrix.rid }}
      - name: Verify package executable
        run: |
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            test -d "dist/${{ matrix.rid }}/Dialogue Machine.app"
            test -x "dist/${{ matrix.rid }}/Dialogue Machine.app/Contents/MacOS/DialogueMachine"
          else
            test -f "dist/${{ matrix.rid }}/DialogueMachine"
            test -x "dist/${{ matrix.rid }}/DialogueMachine"
          fi
      - name: Upload verification results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.rid }}-verification
          path: |
            verification.txt
            artifacts/**/*.png
            artifacts/ci-scenario-*.json
          retention-days: 3
          overwrite: true

  unity:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check out source
        if: env.UNITY_LICENSE != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Unity EditMode tests
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        with:
          unityVersion: '2022.3.40f1'
          testMode: EditMode
          projectPath: .

  godot:
    name: Godot Conformance Tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot 4.3 headless
        shell: bash
        run: |
          curl -sSL "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          echo "fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version
      - name: Copy conformance fixtures
        shell: bash
        run: |
          mkdir -p Engines/Godot/addons/dialogue_machine/tests/conformance
          cp Engines/Conformance/*.json Engines/Godot/addons/dialogue_machine/tests/conformance/
      - name: Import the sample project and parse every script
        shell: bash
        run: |
          godot --headless --path Engines/Godot --import
          status=0
          for f in $(cd Engines/Godot && find addons -name '*.gd'); do
            out=$(godot --headless --path Engines/Godot --check-only --script "res://$f" 2>&1) || status=1
            if echo "$out" | grep -qE "SCRIPT ERROR|Parse Error"; then echo "$f"; echo "$out"; status=1; fi
          done
          exit $status
      - name: Run Godot conformance tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path Engines/Godot --script res://addons/dialogue_machine/tests/run_conformance.gd 2>&1 | tee godot-test.log
          # A script that fails to compile can still exit 0, so the summary line has to say nothing failed.
          grep -q -- "--- Summary: [0-9]* passed, 0 failed ---" godot-test.log
          ! grep -q "SCRIPT ERROR" godot-test.log

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, cross-platform, godot]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          fi
          echo "Attempting artifact download if available..."
          gh release view "$RELEASE_TAG" || true
