name: Godot plugin tests

# Only when the Godot plugin or the shared conformance fixtures change.
on:
  pull_request:
    branches: [master, main]
    paths: ['Engines/Godot/**', 'Engines/Conformance/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    name: Godot Conformance Tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot 4.3 headless
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          echo "fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version
      - name: Copy conformance fixtures
        shell: bash
        run: |
          mkdir -p Engines/Godot/addons/dialogue_machine/tests/conformance
          cp Engines/Conformance/*.json Engines/Godot/addons/dialogue_machine/tests/conformance/
      - name: Import the sample project and parse every script
        shell: bash
        run: |
          godot --headless --path Engines/Godot --import
          status=0
          for f in $(cd Engines/Godot && find addons -name '*.gd'); do
            out=$(godot --headless --path Engines/Godot --check-only --script "res://$f" 2>&1) || status=1
            if echo "$out" | grep -qE "SCRIPT ERROR|Parse Error"; then echo "$f"; echo "$out"; status=1; fi
          done
          exit $status
      - name: Run Godot conformance tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path Engines/Godot --script res://addons/dialogue_machine/tests/run_conformance.gd 2>&1 | tee godot-test.log
          # A script that fails to compile can still exit 0, so the summary line has to say nothing failed.
          grep -q -- "--- Summary: [0-9]* passed, 0 failed ---" godot-test.log
          ! grep -q "SCRIPT ERROR" godot-test.log
      - name: Run Godot dialogue view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path Engines/Godot --script res://addons/dialogue_machine/tests/run_view_tests.gd 2>&1 | tee godot-view.log
          grep -q -- "--- View tests: 0 failed ---" godot-view.log
          ! grep -q "SCRIPT ERROR" godot-view.log
